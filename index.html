<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <!--favicon -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,user-scalable=no">
        <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png">
        <link rel="icon" type="/image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
        <link rel="icon" type="/image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
        <link rel="manifest" href="site.webmanifest">
        <meta name="theme-color" content="#ffffff">

        <title>Guillaume Bertrand - Portfolio</title>
        <link rel="stylesheet" href="css/style.css">
	</head>
	<body>
        <!--
        <script type="importmap">
            {
              "imports": {
                "three": "../../libs/three/build/three.module.js"
              }
            }
        </script>-->
        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
                }
            }
        </script>
        <script type="module">
            import { App } from './js/app.js';

            document.addEventListener("DOMContentLoaded", function(){
                const app = new App();
                window.app = app;
            });
        </script>



        <canvas id="webgl"></canvas>

        <!-- Vignette -->
        <div id="vignette"></div>

        <!-- Flash -->
        <div id="flash-overlay"></div>
    
        <!-- Menu UI -->
        <div class="menu" id="menu-scenes">
            <button data-id="1">Home</button>
            <button data-id="2">Projects</button>
            <button data-id="3">Resume</button>
            <button data-id="4">Contact</button>
        </div>

        <div class="menu" id="menu-projects">
        </div>

        <!-- Barre de filtres -->
        <div id="filter-bar">
            <div id="filter-content">
                <!-- Groupe search + reset ensemble -->
                <div id="search-group">
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="Rechercher par nom..."
                    >
                    <button id="reset-filters">Reset</button>
                </div>
                
                <div id="tag-filters">
                    <!-- Les tags seront générés dynamiquement -->
                </div>
            </div>
            <button id="toggle-filters" class="toggle-btn">▼</button>
        </div>
        

        <!-- Top right buttons -->
        <div id="top-right-buttons">
            <a id="btn-linkedin" href="https://www.linkedin.com/in/guillaumebertrand33/" target="_blank" rel="noopener noreferrer" title="LinkedIn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="28" height="28">
                    <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                </svg>
            </a>
            <button id="btn-contact" title="Contact">✉</button>
        </div>

        <!-- Texte du projet actif -->
        <div id="current-project">
            <h3 id="project-name">-</h3>
        </div>

        <!-- Audio en arrière-plan -->
        <audio id="background-music" loop>
            <source src="../../assets/sounds/loop.mp3" type="audio/mpeg">
        </audio>
        <audio id="flashSFX">
            <source src="../../assets/sounds/flash.mp3" type="audio/mpeg">
        </audio>

        <footer id="copyright">
            Copyright © 2026, Guillaume Bertrand. All other copyrighted materials are property of their respective copyright holders.
        </footer>
	</body>
</html>
